name: Smoke Test

on:
  pull_request:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      GRADLE_TOOLCHAIN_ARGS: >-
        -PtestJvmVersion=11
        -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64
        -Porg.gradle.java.installations.auto-download=false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # Java 11 is for running tests. Other version is for building the SDK.
          java-version: |
            11
            17
          cache: 'gradle'

      - uses: docker/setup-docker-action@v5.7.0
        with:
          version: v28.5.1
          set-host: true

      - name: run gradle build
        run: ./gradlew clean build $GRADLE_TOOLCHAIN_ARGS

      - name: run integration tests
        run: ./gradlew integrationTest $GRADLE_TOOLCHAIN_ARGS

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-results
          path: |
            build/test-results/**
            build/reports/tests/**
          retention-days: 7

      - name: Publish test results
        if: ${{ !cancelled() }}
        run: |
          curl https://raw.githubusercontent.com/couchbaselabs/junit-markdown/refs/heads/main/JunitMarkdown.java --output ${{ runner.temp }}/JunitMarkdown.java
          java ${{ runner.temp }}/JunitMarkdown.java . >> $GITHUB_STEP_SUMMARY
